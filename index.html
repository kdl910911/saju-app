<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>픽사 3D 4컷 사주 웹툰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 화면 1: 사주 정보 입력 화면 -->
  <main id="screen-input" class="screen">
    <div class="card">
      <header>
        <span class="badge">🎬 PIXAR 3D WEBTOON</span>
        <h1>🎨 픽사 4컷 사주 웹툰</h1>
        <p>내 사주를 주인공으로 한 3D 애니메이션 만화가 제작됩니다!</p>
      </header>

      <form id="saju-form">
        <!-- 이름 입력란 -->
        <div class="input-group">
          <label for="userName">이름 또는 닉네임</label>
          <input type="text" id="userName" placeholder="예: 김사주, 행운이" required>
        </div>

        <div class="input-group">
          <label for="birthDate">생년월일</label>
          <input type="date" id="birthDate" required>
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="calendarType">양력/음력</label>
            <select id="calendarType">
              <option value="양력">양력</option>
              <option value="음력(평달)">음력 (평달)</option>
              <option value="음력(윤달)">음력 (윤달)</option>
            </select>
          </div>

          <div class="input-group">
            <label for="gender">성별</label>
            <select id="gender">
              <option value="남성">남성</option>
              <option value="여성">여성</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label for="birthTime">태어난 시간 (선택)</label>
          <input type="time" id="birthTime">
        </div>

        <div class="input-group">
          <label for="concern">주요 고민/궁금한 점</label>
          <input type="text" id="concern" placeholder="예: 재물운, 연애운, 직장 이직 등">
        </div>

        <button type="submit" id="submit-btn">4컷 픽사 웹툰 제작하기 🚀</button>
      </form>
    </div>
  </main>

  <!-- 화면 2: 로딩 화면 -->
  <div id="screen-loading" class="screen hidden">
    <div class="loading-box">
      <div class="pen-animation">🎬</div>
      <h2>픽사 3D 만화를 렌더링하는 중...</h2>
      <p>사주 명식을 분석하고 4컷 일러스트를 그리고 있습니다.<br>잠시만 기다려 주세요! (약 20초)</p>
    </div>
  </div>

  <!-- 화면 3: 웹툰 결과 화면 -->
  <main id="screen-result" class="screen hidden">
    <div class="webtoon-container">
      <div class="nav-bar">
        <button id="back-btn" class="back-btn">← 다시 입력하기</button>
      </div>

      <header class="webtoon-header">
        <div id="character-emoji" class="char-avatar">🐯🔥</div>
        <h1 id="episode-title">웹툰 에피소드 제목</h1>
        <p id="character-info" class="char-desc">캐릭터 설명</p>
      </header>

      <!-- 4컷 만화가 세로로 나열되는 공간 -->
      <section id="webtoon-cuts" class="cuts-feed"></section>

      <!-- 결론 및 행운 아이템 -->
      <footer class="webtoon-footer">
        <h3>✨ 행운의 치트키</h3>
        <p id="lucky-text"></p>
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="share-btn">맨 위로 가기</button>
      </footer>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
