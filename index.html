<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정통 4컷 사주 만화</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 화면 1: 사주 정보 입력 화면 -->
  <main id="screen-input" class="screen">
    <div class="card">
      <header>
        <span class="badge">4-KOMA COMIC</span>
        <h1>📖 4컷 사주 만화</h1>
        <p>생년월일시를 입력하면 나만의 4컷 만화가 연재됩니다!</p>
      </header>

      <form id="saju-form">
        <div class="input-group">
          <label for="userName">이름 / 닉네임</label>
          <input type="text" id="userName" placeholder="예: 김덕렬, 아야네" required>
        </div>

        <div class="input-group">
          <label for="birthDate">생년월일</label>
          <input type="date" id="birthDate" required>
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="calendarType">양력/음력</label>
            <select id="calendarType">
              <option value="양력">양력</option>
              <option value="음력(평달)">음력 (평달)</option>
              <option value="음력(윤달)">음력 (윤달)</option>
            </select>
          </div>

          <div class="input-group">
            <label for="gender">성별</label>
            <select id="gender">
              <option value="남성">남성</option>
              <option value="여성">여성</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label for="birthTime">태어난 시간 (선택)</label>
          <input type="time" id="birthTime">
        </div>

        <div class="input-group">
          <label for="concern">주요 고민/궁금한 점</label>
          <input type="text" id="concern" placeholder="예: 재물운, 직장이직, 연애운 등">
        </div>

        <button type="submit" id="submit-btn">4컷 만화 생성하기 🚀</button>
      </form>
    </div>
  </main>

  <!-- 화면 2: 로딩 화면 -->
  <div id="screen-loading" class="screen hidden">
    <div class="loading-box">
      <div class="pen-animation">✒️</div>
      <h2>4컷 만화를 콘티 작업 중...</h2>
      <p>도사와 주인공의 대사와 컷 일러스트를 그리고 있습니다.</p>
    </div>
  </div>

  <!-- 화면 3: 4컷 만화 원고지 결과 화면 -->
  <main id="screen-result" class="screen hidden">
    <div class="manga-page">
      <div class="nav-bar">
        <button id="back-btn" class="back-btn">← 다시 입력하기</button>
      </div>

      <!-- 상단 제목: <냉혹한 프로> 스타일 -->
      <div class="manga-header">
        <h1 id="comic-title">〈사주 만화 제목〉</h1>
      </div>

      <!-- 4컷 만화 스트립 -->
      <section id="manga-strip" class="manga-strip"></section>

      <!-- 만화 하단 정보 & 행운 조언 -->
      <footer class="manga-footer">
        <div id="lucky-advice" class="lucky-box"></div>
        <p class="copyright">© 2026 AI SAJU COMICS. All Rights Reserved.</p>
      </footer>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
